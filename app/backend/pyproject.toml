[project]
name = "backend"
version = "0.1.0"
description = "Django REST api backend for image stock"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.3",
    "django-filter>=25.2",
    "django-mongodb-backend>=6.0.2",
    "djangorestframework>=3.17.1",
    "gunicorn>=25.3.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 88
target-version = "py314"
force-exclude = true
exclude = [
      "*/migrations/*.py",
      "mongo_migrations/**/*.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "DJ"]
ignore = []

[tool.ruff.format]
quote-style = "double"
