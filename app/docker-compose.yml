# THIS IS DEV DOCKER COMPOSE FILE
# DO NOT USE THIS IN PROD
# USE docker-compose.prod.yml FOR PROD
services:
  db:
    image: mongo:7.0
    container_name: stocker_mongo_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "27017:27017" # ONLY FOR DEV
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      target: builder
    container_name: stocker_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    command: >
      bash -c "uv run python manage.py migrate &&
               uv run python manage.py create_default_users &&
               uv run python manage.py seed_default_images &&
               uv run python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: stocker_frontend_dev
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  nginx:
    image: nginx:1.30.0-alpine
    container_name: stocker_nginx_dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-7117}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mongo_data:
