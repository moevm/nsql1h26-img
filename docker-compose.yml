# PRODUCTION DOCKER COMPOSE FILE
services:
  media-init:
    image: busybox:1.36
    container_name: stocker_media_init
    restart: "no"
    command: >
      sh -c "mkdir -p /media/uploads &&
             chown -R 999:999 /media &&
             chmod -R u+rwX,go+rX /media"
    volumes:
      - type: volume
        source: media_data
        target: /media
        volume:
          nocopy: true

  db:
    image: mongo:7.0
    container_name: stocker_mongo
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./app/backend
    container_name: stocker_backend
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_default_users &&
             python manage.py seed_default_images &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - media_data:/app/media
    depends_on:
      media-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./app/frontend
      target: prod
    container_name: stocker_frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.30.0-alpine
    container_name: stocker_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:2026:80"
    volumes:
      - ./app/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  mongo_data:
  media_data:
